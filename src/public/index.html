<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModelMeter · OpenAI 用量</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">LOCAL OPENAI MONITOR</p><h1>ModelMeter</h1><p class="muted">仅统计经过本机代理的 OpenAI API 请求</p></div>
      <div class="status"><span></span>监听中 <code>127.0.0.1:3188</code></div>
    </header>
    <section class="cards" id="cards"></section>
    <section class="panel"><div class="panel-head"><h2>本月预算</h2><form id="budget-form"><label>USD <input id="budget" type="number" min="0" step="0.01" placeholder="未设置"></label><button>保存</button></form></div><div class="progress"><i id="progress"></i></div><p id="budget-note" class="muted"></p></section>
    <section class="panel"><h2>按模型</h2><div class="table-wrap"><table><thead><tr><th>模型</th><th>请求</th><th>输入</th><th>输出</th><th>总 token</th><th>估算费用</th></tr></thead><tbody id="models"></tbody></table></div></section>
    <section class="panel"><h2>最近记录</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>模型</th><th>端点</th><th>token</th><th>费用</th><th>状态</th></tr></thead><tbody id="recent"></tbody></table></div></section>
    <footer>提示词、回答和 API Key 不会被记录。费用为本地价格表估算值。</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
